<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>AgentAudit — Decision Explanation</title>
<link rel="icon" href="assets/logo-mark.png" />
<link rel="stylesheet" href="style.css" />
<script src="app.js"></script>
</head>
<body>
<script>
const agentKey = getParam("agent");
const runId = getParam("run");

renderShell({
  crumbs: ["Dashboard", "Agent Runs", "Explanation"],
  contentHtml: `<div id="content-inner" class="empty"><span class="spinner"></span> Loading…</div>`
});

async function load() {
  if (!agentKey || !runId) {
    document.getElementById("content-inner").innerHTML = `<div class="empty">Missing agent/run. <a class="link-btn" href="agent-runs.html">&larr; Go to Agent Runs</a></div>`;
    return;
  }
  try {
    const run = await api(`/runs/${encodeURIComponent(agentKey)}/${encodeURIComponent(runId)}`);
    const decision = run.final_decision.decision;
    const isAnomalous = run.analysis.is_anomalous;
    const risk = isAnomalous ? "High" : (decision === "REJECT" || decision === "ESCALATE" ? "Medium" : "Low");
    const toolCalls = run.events.filter(e => e.event_type === "tool_call");

    document.getElementById("content-inner").innerHTML = `
      <div class="inpage-crumbs">
        <a href="dashboard.html">Dashboard</a>${ICONS.chevRight}
        <a href="agent-runs.html">Agent Runs</a>${ICONS.chevRight}
        <b>Explanation</b>
      </div>
      <div class="page-head">
        <div>
          <h1 class="title">${ICONS.msg} Decision Explanation <span class="run-pill">#${runId.slice(0,8)}</span></h1>
          <p class="subtitle">Narrative audit trail explaining the logic and evidence behind this decision.</p>
        </div>
        <div class="actions">
          <button class="btn" onclick="location.href='decision-graph.html?agent=${agentKey}&run=${runId}'">${ICONS.graph} View Decision Graph</button>
        </div>
      </div>

      <div class="grid g4 mb-lg">
        <div class="card stat" style="padding:14px 16px;"><span class="label">Status</span><span class="pill dot green" style="width:fit-content; margin-top:4px;">Completed</span></div>
        <div class="card stat" style="padding:14px 16px;"><span class="label">Risk</span><span class="pill ${pillForRisk(risk)}" style="width:fit-content; margin-top:4px;">${risk}</span></div>
        <div class="card stat" style="padding:14px 16px;"><span class="label">Decision</span><div class="value txt">${decision}</div></div>
        <div class="card stat" style="padding:14px 16px;"><span class="label">Anomaly</span><div class="value txt" style="color:${isAnomalous ? 'var(--red)' : 'var(--green)'};">${isAnomalous ? "Yes" : "No"}</div></div>
      </div>

      <div class="grid g-main-wide">
        <div class="card">
          <div class="card-head">
            <div>
              <h3 class="card-title" style="font-size:15px;">Plain-English Explanation</h3>
              <div class="card-sub">Generated by AgentAudit's Explanation layer</div>
            </div>
            <span class="pill blue">Audit-Ready</span>
          </div>
          <div id="explanation-body" style="font-size:13.5px; line-height:1.7;">
            <span class="spinner"></span> Generating explanation…
          </div>
        </div>

        <div>
          <div class="card mb">
            <h3 class="card-title" style="font-size:15px;">Evidence Panel</h3>
            <div class="card-sub" style="margin-bottom:12px;">Every tool call this decision relied on</div>
            ${toolCalls.length ? toolCalls.map(t => `
              <div class="flex between items-center" style="padding:10px 0; border-bottom:1px solid #EEF0F6;">
                <span class="td-strong" style="font-size:12.5px;">${escapeHtml(t.tool_name)}</span>
                <span class="pill gray">Tool Call</span>
              </div>
            `).join("") : `<div style="font-size:12.5px; color:var(--faint);">No tool calls recorded.</div>`}
          </div>

          <div class="card">
            <h3 class="card-title" style="font-size:15px;">Decision Timeline</h3>
            <div class="timeline" style="margin-top:14px;">
              ${run.events.map(e => `
                <div class="t-item">
                  <div class="t-dot ${e.event_type === 'tool_call' ? 'green' : 'violet'}"></div>
                  <div>
                    <div class="t-time">${(e.timestamp || "").slice(11,19)}</div>
                    <div class="t-title" style="font-size:13px;">${e.event_type === 'tool_call' ? escapeHtml(e.tool_name) : 'LLM reasoning'}</div>
                  </div>
                </div>
              `).join("")}
            </div>
          </div>
        </div>
      </div>
    `;
    document.getElementById("content-inner").className = "";

    try {
      const result = await api(`/runs/${encodeURIComponent(agentKey)}/${encodeURIComponent(runId)}/explain`, { method: "POST" });
      const cleaned = result.explanation.split("\n").map(line => line.trim()).join("\n");
      document.getElementById("explanation-body").innerHTML = `<div style="white-space:pre-wrap;">${escapeHtml(cleaned)}</div>`;
    } catch (explainErr) {
      document.getElementById("explanation-body").innerHTML = `<div class="callout red"><div class="b">Could not generate explanation: ${escapeHtml(explainErr.message)}</div></div>`;
    }
  } catch (e) {
    document.getElementById("content-inner").innerHTML = `<div class="empty" style="color:var(--red);">Failed to load run: ${e.message}</div>`;
  }
}
load();
</script>
</body>
</html>
